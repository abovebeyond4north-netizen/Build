name: Deploy Hybrid Income Site

on:
  push:
    branches: [main]
    paths:
      - "passive-income-engine/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: passive-income-engine/requirements.txt
      - name: Install runtime dependencies
        working-directory: passive-income-engine
        run: pip install -r requirements.txt
      - name: Generate static acquisition site
        working-directory: passive-income-engine
        env:
          BACKEND_PUBLIC_URL: ${{ vars.PASSIVE_INCOME_BACKEND_URL }}
          STATIC_SITE_URL: https://abovebeyond4north-netizen.github.io/Build
          PAGES_BASE_PATH: /Build
        run: python scripts/build_static_site.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: passive-income-engine/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
