name: ADI Genesis-16 Pilot

on:
  push:
    branches: ["adi/genesis16-nonlinear-uncertainty"]
    paths:
      - "adi_genesis16/**"
      - ".github/workflows/adi-genesis16-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile adi_genesis16/*.py
      - name: Run development-only Genesis-16 pilot
        run: python -m adi_genesis16.pilot
      - uses: actions/upload-artifact@v4
        with:
          name: genesis16-pilot-ledger
          path: genesis16_pilot.json
          if-no-files-found: error
