name: ADI Genesis-15 Pilot

on:
  push:
    branches:
      - "adi/genesis15-uncertainty-gated-belief"
    paths:
      - "adi_genesis15/**"
      - ".github/workflows/adi-genesis15-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile pilot
        run: python -m py_compile adi_genesis15/experiment.py adi_genesis15/pilot.py
      - name: Run development-only pilot
        run: python -m adi_genesis15.pilot
      - name: Preserve pilot ledger
        uses: actions/upload-artifact@v4
        with:
          name: genesis15-pilot-ledger
          path: genesis15_pilot.json
          if-no-files-found: error
