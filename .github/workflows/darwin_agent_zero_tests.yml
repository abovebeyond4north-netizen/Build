name: Darwin Agent Zero Tests

on:
  push:
    branches: [main]
    paths:
      - 'darwin_agent_zero/**'
      - 'verified-coding-loop-dashboard/scripts/lib/capability-evidence.mjs'
      - 'verified-coding-loop-dashboard/scripts/verify-capability-evidence.mjs'
      - 'verified-coding-loop-dashboard/scripts/meta-learning-loop.mjs'
      - 'verified-coding-loop-dashboard/scripts/meta-learning-loop.mjs'
      - 'verified-coding-loop-dashboard/package.json'
      - '.github/workflows/darwin_agent_zero_tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'darwin_agent_zero/**'
      - 'verified-coding-loop-dashboard/scripts/lib/capability-evidence.mjs'
      - 'verified-coding-loop-dashboard/scripts/verify-capability-evidence.mjs'
      - 'verified-coding-loop-dashboard/package.json'
      - '.github/workflows/darwin_agent_zero_tests.yml'

permissions:
  contents: read

concurrency:
  group: darwin-agent-zero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: darwin_agent_zero/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install package
        run: |
          cd darwin_agent_zero
          python -m pip install --disable-pip-version-check -e .

      - name: Compile package and tests
        run: |
          cd darwin_agent_zero
          python -m compileall -q src tests scripts

      - name: Run Darwin validation suite
        run: |
          cd darwin_agent_zero
          python scripts/validate.py

      - name: Run capability acquisition validation
        run: |
          cd darwin_agent_zero
          python scripts/validate_capabilities.py

      - name: Generate sealed dashboard capability evidence
        run: |
          cd darwin_agent_zero
          python scripts/validate_dashboard_evidence.py

      - name: Verify dashboard capability evidence contract
        run: |
          node verified-coding-loop-dashboard/scripts/verify-capability-evidence.mjs \
            darwin_agent_zero/.dgm_dashboard_evidence/capability-evidence.json

      - name: Prove meta-learning consumes sealed capability evidence
        run: |
          cd verified-coding-loop-dashboard
          CAPABILITY_EVIDENCE_PATH="$GITHUB_WORKSPACE/darwin_agent_zero/.dgm_dashboard_evidence/capability-evidence.json" \
            node scripts/meta-learning-loop.mjs
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('learning/meta-learning-report.json','utf8'));if(r.capabilityEvidenceAccepted!==true||r.capabilityStatus!=='independent_holdout_improvement')process.exit(1);"

      - name: Upload capability evidence receipt
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: darwin-capability-evidence-${{ github.sha }}
          path: |
            darwin_agent_zero/.dgm_dashboard_evidence/capability-evidence.json
            darwin_agent_zero/.dgm_dashboard_evidence/reliability_gate.jsonl
            darwin_agent_zero/.dgm_dashboard_evidence/capability_certifications.jsonl
            darwin_agent_zero/.dgm_dashboard_evidence/capability_acquisition_report.json
          retention-days: 14
