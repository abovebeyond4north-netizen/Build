name: emergent-agent-tests

on:
  push:
    branches: [main]
    paths:
      - "emergent_intelligence_agent/**"
      - ".github/workflows/emergent-agent-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "emergent_intelligence_agent/**"
      - ".github/workflows/emergent-agent-tests.yml"

permissions:
  contents: read

concurrency:
  group: emergent-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: emergent_intelligence_agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile package and tests
        run: python -m compileall -q emergent_agent tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI smoke test
        run: python -m emergent_agent.cli --evolve "Build reasoning language and data skills"
