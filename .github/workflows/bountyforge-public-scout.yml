name: BountyForge Public Scout

on:
  push:
    branches:
      - main
    paths:
      - "passive-income-engine/bountyforge.py"
      - "passive-income-engine/bounty_solver.py"
      - "passive-income-engine/bounty_preflight.py"
      - "passive-income-engine/bounty_bid_packet.py"
      - "passive-income-engine/requirements.txt"
      - ".github/workflows/bountyforge-public-scout.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bountyforge-public-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: passive-income-engine
    env:
      DATABASE_PATH: /tmp/bountyforge-public.db
      BOUNTYFORGE_ENABLED: "true"
      BOUNTYFORGE_PUBLIC_SCOUT: "true"
      BOUNTYFORGE_PUBLIC_SKILLS: "csv,json,data,python,documentation"
      BOUNTYFORGE_PUBLIC_TASKS_PER_SIGNAL: "20"
      BOUNTYFORGE_QUEUE_DIR: /tmp/bounty-queue
      BOUNTYFORGE_REPO_VERIFY_DIR: /tmp/repo-verify
      BOUNTYFORGE_AUTO_BID: "false"
      BOUNTYFORGE_AUTO_SOLVE: "false"
      BOUNTYFORGE_AUTO_REPO_VERIFY: "false"
      BOUNTYFORGE_AUTO_DELIVER: "false"
      BOUNTYFORGE_RECONCILE_PAYMENTS: "false"
      OPENTASK_TOKEN: ""

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: passive-income-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Scout public OpenTask work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bountyforge import BountyForge

          forge = BountyForge()
          result = forge.run_once()
          Path("public-scout.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, default=str) + "\n"
          )

          candidates = result.get("summary", {}).get("top_candidates", [])
          lines = [
              "# BountyForge public scout",
              "",
              f"Discovered: {result.get('discovered', 0)}",
              f"Eligible: {result.get('eligible', 0)}",
              "",
              "## Highest-ranked eligible candidates",
              "",
          ]
          if not candidates:
              lines.append("No candidates cleared the configured profitability and safety gates.")
          else:
              lines.append("| Task | Mode | Fit | Bid ready | Fulfillment | Reward | Expected profit | Expected hourly |")
              lines.append("| --- | --- | ---: | --- | --- | ---: | ---: | ---: |")
              for item in candidates[:10]:
                  title = str(item.get("title") or "").replace("|", "\\|")
                  url = str(item.get("task_url") or "")
                  label = f"[{title}]({url})" if url.startswith("https://") else title
                  ready = "yes" if item.get("bid_ready") else "no"
                  fulfillment = str(item.get("fulfillment_kind") or "")
                  lines.append(
                      f"| {label} | {item.get('execution_mode', '')} | "
                      f"{item.get('match_score', 0)} | {ready} | {fulfillment} | "
                      f"{item.get('reward_cents', 0) / 100:.2f} {item.get('currency', '')} | "
                      f"{item.get('expected_profit_cents', 0) / 100:.2f} | "
                      f"{item.get('expected_hourly_cents', 0) / 100:.2f}/h |"
                  )

          rejected = result.get("summary", {}).get("top_rejections", [])
          lines.extend(["", "## Highest-fit rejected tasks", ""])
          if not rejected:
              lines.append("No rejected tasks were available.")
          else:
              lines.append("| Task | Fit | Reason | Reward |")
              lines.append("| --- | ---: | --- | ---: |")
              for item in rejected[:10]:
                  title = str(item.get("title") or "").replace("|", "\\|")
                  url = str(item.get("task_url") or "")
                  label = f"[{title}]({url})" if url.startswith("https://") else title
                  lines.append(
                      f"| {label} | {item.get('match_score', 0)} | "
                      f"{item.get('decision_reason', '')} | "
                      f"{item.get('reward_cents', 0) / 100:.2f} {item.get('currency', '')} |"
                  )
          Path("public-scout-summary.md").write_text("\n".join(lines) + "\n")
          PY
          cat public-scout-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preflight top bid-ready tasks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bounty_preflight import preflight_task

          scout = json.loads(Path("public-scout.json").read_text())
          candidates = [
              item
              for item in scout.get("summary", {}).get("top_candidates", [])
              if item.get("bid_ready")
          ][:3]

          results = []
          for item in candidates:
              task_id = str(item.get("external_id") or "")
              if not task_id:
                  continue
              try:
                  results.append(preflight_task(task_id))
              except Exception as exc:
                  results.append(
                      {
                          "task_id": task_id,
                          "bid_ready": False,
                          "blocked_by": "preflight_error",
                          "error": str(exc)[:500],
                          "write_actions_performed": False,
                      }
                  )

          Path("public-preflight.json").write_text(
              json.dumps(
                  {
                      "preflight_count": len(results),
                      "write_actions_performed": False,
                      "results": results,
                  },
                  indent=2,
                  sort_keys=True,
                  default=str,
              )
              + "\n"
          )

          lines = ["# BountyForge read-only preflight", ""]
          if not results:
              lines.append("No bid-ready candidates were available for preflight.")
          else:
              lines.append("| Task | Ready | Status | Age | Blocker | Fulfillment | Artifact SHA-256 |")
              lines.append("| --- | --- | --- | ---: | --- | --- | --- |")
              for result in results:
                  url = str(result.get("task_url") or "")
                  title = str(result.get("title") or result.get("task_id") or "").replace("|", "\\|")
                  label = f"[{title}]({url})" if url.startswith("https://") else title
                  route = result.get("fulfillment") or {}
                  state = result.get("task_state") or {}
                  artifact = result.get("artifact") or {}
                  digest = str(artifact.get("sha256") or "")
                  short_digest = (digest[:16] + "…") if digest else ""
                  age = state.get("updated_age_days")
                  age_text = "" if age is None else f"{age}d"
                  lines.append(
                      f"| {label} | {'yes' if result.get('bid_ready') else 'no'} | "
                      f"{state.get('status') or 'unknown'} | {age_text} | "
                      f"{result.get('blocked_by', '')} | {route.get('kind', '')} | {short_digest} |"
                  )
          Path("public-preflight-summary.md").write_text("\n".join(lines) + "\n")
          PY
          cat public-preflight-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build immutable dry-run bid packets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bounty_bid_packet import build_bid_packet_from_preflight

          preflight = json.loads(Path("public-preflight.json").read_text())
          packets = [
              build_bid_packet_from_preflight(result)
              for result in preflight.get("results", [])
          ]

          Path("public-bid-packets.json").write_text(
              json.dumps(
                  {
                      "packet_count": len(packets),
                      "write_actions_performed": False,
                      "packets": packets,
                  },
                  indent=2,
                  sort_keys=True,
                  default=str,
              )
              + "\n"
          )

          lines = ["# BountyForge dry-run bid packets", ""]
          ready = [packet for packet in packets if packet.get("packet_ready")]
          if not ready:
              lines.append("No immutable bid packets were ready.")
          else:
              lines.append("| Task | Intent SHA-256 | Preflight blocker | Write enabled |")
              lines.append("| --- | --- | --- | --- |")
              for packet in ready:
                  intent = packet.get("intent") or {}
                  task = intent.get("task") or {}
                  task_id = str(task.get("id") or "")
                  title = str(task.get("title") or task_id).replace("|", "\\|")
                  url = str(task.get("url") or "")
                  label = f"[{title}]({url})" if url.startswith("https://") else title
                  digest = str(packet.get("intent_sha256") or "")
                  guards = intent.get("guards") or {}
                  lines.append(
                      f"| {label} | {digest[:20]}… | "
                      f"{packet.get('current_preflight_blocker') or 'none'} | "
                      f"{'yes' if guards.get('write_action_enabled') else 'no'} |"
                  )
          lines.extend(
              [
                  "",
                  "Packets are read-only audit artifacts. They are not bids and no marketplace write occurred.",
              ]
          )
          Path("public-bid-packets-summary.md").write_text("\n".join(lines) + "\n")
          PY
          cat public-bid-packets-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bountyforge-public-scout
          path: |
            passive-income-engine/public-scout.json
            passive-income-engine/public-scout-summary.md
            passive-income-engine/public-preflight.json
            passive-income-engine/public-preflight-summary.md
            passive-income-engine/public-bid-packets.json
            passive-income-engine/public-bid-packets-summary.md
          retention-days: 14
          if-no-files-found: error
