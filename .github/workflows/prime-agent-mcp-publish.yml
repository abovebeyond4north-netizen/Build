name: Publish Prime-Agent MCP Registry

on:
  push:
    branches:
      - feat/prime-agent-x402-intelligence
    paths:
      - prime-agent-x402/server.json
      - .github/workflows/prime-agent-mcp-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish Prime-Agent
        run: ./mcp-publisher publish prime-agent-x402/server.json
