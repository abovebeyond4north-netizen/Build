name: Chimera Defensive Lab CI

on:
  push:
    paths:
      - "chimera-defensive-lab/**"
      - ".github/workflows/chimera_defensive_lab_ci.yml"
  pull_request:
    paths:
      - "chimera-defensive-lab/**"
      - ".github/workflows/chimera_defensive_lab_ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chimera-defensive-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest
