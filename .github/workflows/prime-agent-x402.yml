name: Prime-Agent x402 core
on:
  pull_request:
    paths:
      - "prime-agent-x402/**"
      - ".github/workflows/prime-agent-x402.yml"
  push:
    branches: [main]
    paths:
      - "prime-agent-x402/**"
      - ".github/workflows/prime-agent-x402.yml"
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile prime_agent.py server.py evaluate.py
        working-directory: prime-agent-x402
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
        working-directory: prime-agent-x402
