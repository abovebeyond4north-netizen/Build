name: ADI Genesis-14

on:
  push:
    branches:
      - main
      - "adi/genesis14-worldmodel-readiness"
    paths:
      - "adi_genesis13/**"
      - "adi_genesis14/**"
      - "tests/test_adi_genesis14.py"
      - "docs/ADI_GENESIS14_PREREGISTRATION.md"
      - ".github/workflows/adi-genesis14.yml"
  pull_request:
    branches: [main]
    paths:
      - "adi_genesis13/**"
      - "adi_genesis14/**"
      - "tests/test_adi_genesis14.py"
      - "docs/ADI_GENESIS14_PREREGISTRATION.md"
      - ".github/workflows/adi-genesis14.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Genesis-14
        run: python -m py_compile adi_genesis13/*.py adi_genesis14/*.py tests/test_adi_genesis14.py
      - name: Run architecture and pilot-mechanism tests
        run: python -m unittest tests.test_adi_genesis14 -v

  confirmatory:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run frozen confirmatory and disjoint replication blocks
        run: python -m adi_genesis14.confirmatory --output genesis14_confirmatory.json
      - name: Preserve immutable result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis14-confirmatory-ledger
          path: genesis14_confirmatory.json
          if-no-files-found: error
