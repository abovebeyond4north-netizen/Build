name: Remote Verifier Authority

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  attestations: write
  issues: write

concurrency:
  group: remote-verifier-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      startsWith(github.event.issue.title, '[DGM-VERIFY] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Evaluate immutable issue-event request
        id: evaluate
        run: |
          mkdir -p remote-verification
          python verifier_authority/remote_issue_request.py \
            "$GITHUB_EVENT_PATH" \
            remote-verification \
            | tee remote-verification/result.json

      - name: Attest remote verification receipt
        uses: actions/attest@v4
        with:
          subject-path: remote-verification/receipt.json

      - name: Verify provenance and reject forged receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify             remote-verification/receipt.json             -R "$GITHUB_REPOSITORY"             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/remote_verifier_authority.yml"             --source-ref refs/heads/main             --deny-self-hosted-runners

          cp remote-verification/receipt.json remote-verification/tampered-receipt.json
          printf '\n ' >> remote-verification/tampered-receipt.json

          if gh attestation verify             remote-verification/tampered-receipt.json             -R "$GITHUB_REPOSITORY"             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/remote_verifier_authority.yml"             --source-ref refs/heads/main             --deny-self-hosted-runners
          then
            echo "tampered receipt unexpectedly verified" >&2
            exit 1
          fi

      - name: Upload attested receipt
        uses: actions/upload-artifact@v7
        with:
          name: dgm-remote-verification-${{ github.event.issue.number }}
          path: |
            remote-verification/receipt.json
            remote-verification/result.json
          retention-days: 30

      - name: Publish receipt back to request issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --input remote-verification/comment.json

      - name: Close completed verification request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -f state=closed \
            -f state_reason=completed
