name: ConceptLab Zero P0-P6

on:
  push:
    branches: [main]
    paths:
      - 'conceptlab_zero/**'
      - '.github/workflows/conceptlab_zero_tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'conceptlab_zero/**'
      - '.github/workflows/conceptlab_zero_tests.yml'

permissions:
  contents: read

concurrency:
  group: conceptlab-zero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    name: Python ${{ matrix.python-version }} sealed P0-P6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile ConceptLab
        run: |
          cd conceptlab_zero
          python -m compileall -q conceptlab.py p1.py p2.py p3.py p4.py p5.py p6.py p6_learner.py tests scripts

      - name: Run unit tests
        run: |
          cd conceptlab_zero
          python -m unittest discover -s tests -v

      - name: Run sealed P0 campaign
        run: |
          cd conceptlab_zero
          python scripts/validate.py

      - name: Run P1 causal campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p1.py

      - name: Run P2 composition, revision, and persistence campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p2.py

      - name: Run P3 withheld-predicate synthesis campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p3.py

      - name: Run P4 adaptive-interface campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p4.py

      - name: Run P5 raw-token discovery campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p5.py

      - name: Run P6 active-curriculum campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p6.py

      - name: Upload P0-P6 evidence bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: conceptlab-p0-p6-${{ github.sha }}
          path: |
            conceptlab_zero/.conceptlab_ci/manifest.commitment
            conceptlab_zero/.conceptlab_ci/sealed_manifest.revealed.json
            conceptlab_zero/.conceptlab_ci/evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/campaign_result.json
            conceptlab_zero/.conceptlab_ci/p1_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p1_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p2_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p2_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p2_restart_receipt.json
            conceptlab_zero/.conceptlab_ci/concept_store/**
            conceptlab_zero/.conceptlab_ci/p3_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p3_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p3_restart_receipt.json
            conceptlab_zero/.conceptlab_ci/symbolic_program_store/**
            conceptlab_zero/.conceptlab_ci/p4_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p4_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p4_restart_receipt.json
            conceptlab_zero/.conceptlab_ci/adapter_store/**
            conceptlab_zero/.conceptlab_ci/p5_manifest.commitment
            conceptlab_zero/.conceptlab_ci/p5_manifest.revealed.json
            conceptlab_zero/.conceptlab_ci/p5_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p5_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p5_restart_receipt.json
            conceptlab_zero/.conceptlab_ci/raw_feature_store/**
            conceptlab_zero/.conceptlab_ci/p6_manifest.commitment
            conceptlab_zero/.conceptlab_ci/p6_manifest.revealed.json
            conceptlab_zero/.conceptlab_ci/p6_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p6_campaign_result.json
            conceptlab_zero/.conceptlab_ci/p6_query_traces.json
            conceptlab_zero/.conceptlab_ci/active_feature_store/**
          retention-days: 14
