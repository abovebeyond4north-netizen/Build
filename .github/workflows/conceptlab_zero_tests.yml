name: ConceptLab Zero P0-P1

on:
  push:
    branches: [main]
    paths:
      - 'conceptlab_zero/**'
      - '.github/workflows/conceptlab_zero_tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'conceptlab_zero/**'
      - '.github/workflows/conceptlab_zero_tests.yml'

permissions:
  contents: read

concurrency:
  group: conceptlab-zero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    name: Python ${{ matrix.python-version }} sealed P0-P1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile ConceptLab
        run: |
          cd conceptlab_zero
          python -m compileall -q conceptlab.py p1.py tests scripts

      - name: Run unit tests
        run: |
          cd conceptlab_zero
          python -m unittest discover -s tests -v

      - name: Run sealed P0 campaign
        run: |
          cd conceptlab_zero
          python scripts/validate.py

      - name: Run P1 causal campaign
        run: |
          cd conceptlab_zero
          python scripts/validate_p1.py

      - name: Upload P0-P1 evidence bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: conceptlab-p0-p1-${{ github.sha }}
          path: |
            conceptlab_zero/.conceptlab_ci/manifest.commitment
            conceptlab_zero/.conceptlab_ci/sealed_manifest.revealed.json
            conceptlab_zero/.conceptlab_ci/evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/campaign_result.json
            conceptlab_zero/.conceptlab_ci/p1_evidence_ledger.jsonl
            conceptlab_zero/.conceptlab_ci/p1_campaign_result.json
          retention-days: 14
