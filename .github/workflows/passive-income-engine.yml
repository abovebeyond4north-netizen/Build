name: Passive Income Engine CI

on:
  pull_request:
    paths:
      - "passive-income-engine/**"
      - ".github/workflows/passive-income-engine.yml"
  push:
    branches:
      - main
      - passive-income-production-hardening
    paths:
      - "passive-income-engine/**"
      - ".github/workflows/passive-income-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passive-income-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: passive-income-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q engine.py scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Exercise backup worker
        run: |
          python - <<'PY'
          import sqlite3, tempfile
          from pathlib import Path
          from scripts.backup_db import backup_once

          with tempfile.TemporaryDirectory() as d:
              root = Path(d)
              source = root / "source.db"
              target = root / "backups"
              with sqlite3.connect(source) as con:
                  con.execute("CREATE TABLE t(v INTEGER)")
                  con.execute("INSERT INTO t VALUES(42)")
              created = backup_once(source, target, retention=3)
              with sqlite3.connect(created) as con:
                  assert con.execute("SELECT v FROM t").fetchone()[0] == 42
          PY

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passive-income-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t passive-income-engine-ci passive-income-engine
      - name: Validate production compose
        working-directory: passive-income-engine
        run: |
          cp .env.example .env
          docker compose -f docker-compose.production.yml config >/dev/null
