name: Passive Income Engine CI

on:
  pull_request:
    paths:
      - "passive-income-engine/**"
      - ".github/workflows/passive-income-engine.yml"
  push:
    branches:
      - passive-income-engine-v1
    paths:
      - "passive-income-engine/**"
      - ".github/workflows/passive-income-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passive-income-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: passive-income-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q engine.py tests
      - run: python -m unittest discover -s tests -v
