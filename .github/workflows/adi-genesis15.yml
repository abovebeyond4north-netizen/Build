name: ADI Genesis-15

on:
  push:
    branches: ["adi/genesis15-uncertainty-gated-belief"]
    paths:
      - "adi_genesis15/**"
      - "tests/test_adi_genesis15.py"
      - "docs/ADI_GENESIS15_PREREGISTRATION.md"
      - ".github/workflows/adi-genesis15.yml"
  pull_request:
    branches: [main]
    paths:
      - "adi_genesis15/**"
      - "tests/test_adi_genesis15.py"
      - "docs/ADI_GENESIS15_PREREGISTRATION.md"
      - ".github/workflows/adi-genesis15.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile adi_genesis15/*.py tests/test_adi_genesis15.py
      - run: python -m unittest tests.test_adi_genesis15 -v

  confirmatory:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run frozen confirmatory and disjoint replication
        run: python -m adi_genesis15.confirmatory --output genesis15_confirmatory.json
      - name: Preserve result ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis15-confirmatory-ledger
          path: genesis15_confirmatory.json
          if-no-files-found: error
