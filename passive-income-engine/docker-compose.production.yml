services:
  engine:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - engine_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bountyforge:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "bountyforge.py", "worker"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - engine_data:/data
      - bounty_queue:/bounty-queue
    depends_on:
      engine:
        condition: service_healthy

  bounty-solver:
    build:\n      context: .
    restart: unless-stopped
    command: ["python", "bounty_solver.py"]
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    environment:
      BOUNTYFORGE_QUEUE_DIR: /bounty-queue
      BOUNTYFORGE_QUEUE_SECRET: ${BOUNTYFORGE_QUEUE_SECRET}
      BOUNTYFORGE_SOLVER_POLL_SECONDS: 5
      BOUNTYFORGE_SOLVER_MAX_INPUT_BYTES: 262144
      BOUNTYFORGE_SOLVER_MAX_OUTPUT_BYTES: 524288
    volumes:
      - bounty_queue:/bounty-queue

  backup:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "scripts/backup_db.py"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - engine_data:/data:ro
      - engine_backups:/backups
    depends_on:
      engine:
        condition: service_healthy

volumes:
  engine_data:
  engine_backups:
  bounty_queue:
