services:
  engine:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - engine_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "scripts/backup_db.py"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - engine_data:/data:ro
      - engine_backups:/backups
    depends_on:
      engine:
        condition: service_healthy

volumes:
  engine_data:
  engine_backups:
